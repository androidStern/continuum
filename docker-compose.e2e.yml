services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: continuum_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${E2E_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d continuum_e2e"]
      interval: 1s
      timeout: 5s
      retries: 30
